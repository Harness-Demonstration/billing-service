name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
# A new push to the same pull request cancels the run for the older commit; only the latest commit's
# result counts for the ruleset and the agent loop. Every other run (main, schedule, manual) gets its own
# group, so it is never cancelled or left waiting.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone sim-service for its message contract
        run: git clone --depth 1 https://github.com/Harness-Demonstration/sim-service.git ../sim-service
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B verify

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-docs.sh
