# billing's own PostgreSQL. Kafka, Debezium and Jaeger come from sim-service/infra/docker-compose.yml;
# both files use the compose project harness-lab, so all containers show up as one group.
name: harness-lab

services:
  billing-postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 5
