# billing's own PostgreSQL. Kafka comes from sim-service/infra/docker-compose.yml.
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 5
